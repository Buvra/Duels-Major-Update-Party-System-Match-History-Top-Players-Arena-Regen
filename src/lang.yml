    not-in-duelzone: '{PREFIX} &cSadece şu bölgelerde düello yapabilirsiniz: %regions%'
    requests-disabled: '{PREFIX} &c%name% şu anda düello tekliflerini kabul etmiyor.'
    already-has-request: '{PREFIX} &c%name% adlı oyuncuya zaten bir teklif gönderdiniz.'
    no-request: '{PREFIX} &c%name% adlı oyuncudan gelen aktif bir teklifiniz yok.'
    already-in-match:
