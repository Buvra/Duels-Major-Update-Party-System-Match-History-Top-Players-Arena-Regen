    name-not-alphanumeric: '{PREFIX} &c''%name%'' yalnızca harf ve rakamlardan oluşmalıdır.'


COMMAND:
  duel:
    usage:
    - '{LINE}'
    - '&f/%command% [oyuncu] &e- &7Oyuncuya düello teklifi gönderir.'
    - '&f/%command% [oyuncu] <miktar> &e- &7Bahisli düello teklifi gönderir.'
    - '&f/%command% [accept | deny] [oyuncu] &e- &7Düello teklifini kabul eder veya reddeder.'
    - '&f/%command% stats <isim> &e- &7Düello istatistiklerini görüntüler.'
    - '&f/%command% toggle &e- &7Düello isteklerini açar veya kapatır.'
    - '&f/%command% top [-|wins|losses|kit] &e- &7En çok kazananlar/kaybedenler veya kit sıralamasını gösterir.'
    - '{LINE}'
    request:
      send:
        sender:
        - '{LINE}'
        - '&6[Düello] &f%name% &7adlı oyuncuya düello teklifi gönderildi.'
        - '&8▪ &7Mod: %mode%'
        - '&8▪ &7Arena: &e%arena%'
        - '&8▪ &7Bahis: &6$%bet_amount%'
        - '{LINE}'
        receiver:
        - '{LINE}'
        - '&6[Düello] &f%name% &7adlı oyuncudan bir düello teklifi aldınız!'
        - '&8▪ &7Mod: %mode%'
        - '&8▪ &7Arena: &e%arena%'
        - '&8▪ &7Bahis: &6$%bet_amount%'
        - '%warning%'
        - '{LINE}'
        clickable-text:
          info:
            text: '&7Cevap vermek için: '
            hover-text: ''
          accept:
            text: '&a&l[KABUL ET] '
            hover-text: '&7Düelloyu &akabul etmek &7için tıkla.'
          deny:
            text: '&c&l[REDDET]'
            hover-text: '&7Düelloyu &creddetmek &7için tıkla.'
          extra:
            text: '{LINE}'
            hover-text: ''
      accept:
        sender: '{PREFIX} &f%name% &7düello teklifinizi kabul etti.'
        receiver: '{PREFIX} &f%name% &7adlı oyuncunun düello teklifini kabul ettiniz.'
      deny:
        sender: '{PREFIX} &f%name% &7adlı oyuncuya gönderdiğiniz düello teklifi reddedildi.'
        receiver: '{PREFIX} &f%name% &7adlı oyuncunun düello teklifini reddettiniz.'
    stats:
      displayed:
      - '{LINE}'
      - '&f%name% &7adlı oyuncunun istatistikleri &e-'
      - '&7Galibiyet: &a%wins%'
      - '&7Mağlubiyet: &c%losses%'
      - '&7K/G Oranı: &b%wl_ratio%'
      - '&7İstek Durumu: &r%requests_enabled%'
      # NOTE: Ratings will only display if either 'display-kit-ratings' or 'display-nokit-rating' is enabled in the configuration.
      rating:
        header: '&7Puan Durumu &e-'
        format: '&f%type%&7: &b%rating%'
        footer: ''
      # NOTE: Past matches will only display if 'display-past-matches' is enabled in the configuration.
      match:
        header: '&7Son Karşılaşmalar &e-'
        format: '&a%winner% &fvs &c%loser% &6[Üzerine Gel!]'
        hover-text:
        - '&7Kit: &3%kit%'
        - '&7Süre: &a%duration%'
        - '&7Zaman: &f%time% önce'
        - '&7Can: &d%health%❤'
        footer: '{LINE}'
    toggle:
      enabled: '{PREFIX} &aArtık düello tekliflerini kabul ediyorsunuz.'
      disabled: '{PREFIX} &cArtık düello tekliflerini kabul etmiyorsunuz.'
    top:
      next-update: '{PREFIX} &7Sonraki güncelleme: &f%remaining%'
      header: '{HALF_LINE} &7İlk &f10 &7%type% {HALF_LINE}'
      display-format: '&e%rank%. &f%name% &e- &f%score% &7%identifier%'
      footer: '{HALF_LINE} &7İlk &f10 &7%type% {HALF_LINE}'

  duels:
    usage:
    - '{LINE}'
    - '&f/%command% help &e- &7Bu yardım sayfasını gösterir.'
    - '&f/%command% help arena &e- &7Arena komutlarının listesini gösterir.'
    - '&f/%command% help kit &e- &7Kit komutlarının listesini gösterir.'
    - '&f/%command% help queue &e- &7Sıra komutlarının listesini gösterir.'
    - '&f/%command% help sign &e- &7Tabela komutlarının listesini gösterir.'
    - '&f/%command% help user &e- &7Oyuncu düzenleme komutlarını gösterir.'
    - '&f/%command% help extra &e- &7Ekstra komutların listesini gösterir.'
    - '{LINE}'
    help:
      arena:
      - '{HALF_LINE} &fArena Komutları {HALF_LINE}'
      - '&f/%command% create [isim] &e- &7Belirtilen isimde bir arena oluşturur.'
      - '&f/%command% set [isim] [1|2] &e- &7Arenanın doğma pozisyonunu ayarlar.'
      - '&f/%command% delete [isim] &e- &7Arenayı siler.'
      - '&f/%command% info [isim] &e- &7Seçili arena hakkında bilgileri gösterir.'
      - '&f/%command% toggle [isim] &e- &7Arenayı açar veya kapatır.'
      - '&f/%command% tp [isim] <1|2> &e- &7Arenaya ışınlar.'
      - '&f/%command% list &e- &7Tüm arenaların listesini gösterir.'
      - '{HALF_LINE} &fArena Komutları {HALF_LINE}'
      kit:
      - '{HALF_LINE} &fKit Komutları {HALF_LINE}'
      - '&f/%command% savekit <-o> [isim] &e- &7Envanterinizi belirtilen isimde kit olarak kaydeder.'
      - '&f/%command% loadkit [isim] &e- &7Seçili kiti envanterinize yükler.'
      - '&f/%command% deletekit [isim] &e- &7Bir kiti siler.'
      - '&f/%command% setitem [isim] &e- &7Kitin menüdeki ikonunu elinizdeki eşya yapar.'
      - '&f/%command% options [kit] &e- &7Kitin özellikler menüsünü açar.'
      - '&f/%command% bind [kit] &e- &7Kiti arenalara bağlama menüsünü açar.'
      - '&f/%command% list &e- &7Tüm kitlerin listesini gösterir.'
      - '{HALF_LINE} &fKit Komutları {HALF_LINE}'
      queue:
      - '{HALF_LINE} &fSıra Komutları {HALF_LINE}'
      - '&f/%command% createqueue [bahis] [-|kit] &e- &7Belirtilen bahis ve kitle sıra oluşturur.'
      - '&f/%command% deletequeue &e- &7Sırayı siler.'
      - '&f/%command% list &e- &7Aktif sıraları listeler.'
      - '{HALF_LINE} &fSıra Komutları {HALF_LINE}'
      sign:
      - '{HALF_LINE} &fTabela Komutları {HALF_LINE}'
      - '&f/%command% addsign [bahis] [-|kit] &e- &7Baktığınız tabelayı sıra tabelası yapar.'
      - '&f/%command% delsign &e- &7Baktığınız sıra tabelasını siler.'
      - '&f/%command% list &e- &7Tüm sıra tabelalarını listeler.'
      - '{HALF_LINE} &fTabela Komutları {HALF_LINE}'
      user:
      - '{HALF_LINE} &fOyuncu Düzenleme Komutları {HALF_LINE}'
      - '&f/%command% setrating [isim] [-|kit] [miktar] &e- &7Oyuncunun puanını ayarlar.'
      - '&f/%command% edit [isim] [add|remove|set] [wins|losses] [miktar] &e- &7Oyuncunun istatistiklerini düzenler.'
      - '&f/%command% resetrating [isim] [-|kit|all] &e- &7Oyuncunun puanlarını sıfırlar.'
      - '&f/%command% reset [isim] &e- &7Oyuncunun tüm verilerini sıfırlar.'
      - '{HALF_LINE} &fOyuncu Düzenleme Komutları {HALF_LINE}'
      extra:
      - '{HALF_LINE} &fEkstra Komutlar {HALF_LINE}'
      - '&f/%command% setlobby &e- &7Düello lobisini bulunduğunuz yere ayarlar.'
      - '&f/%command% lobby &e- &7Düello lobisine ışınlar.'
      - '&f/%command% playsound [isim] &e- &7Belirtilen sesi çalar.'
      - '&f/%command% reload <modül> &e- &7Eklentiyi veya belirtilen modülü yeniler.'
      - '{HALF_LINE} &fEkstra Komutlar {HALF_LINE}'
    create: '{PREFIX} &7Arena &e%name% &7başarıyla oluşturuldu. Başlangıç noktaları için: &f/duels set %name% 1'
    delete: '{PREFIX} &7Arena &e%name% &7başarıyla silindi.'
    set: '{PREFIX} &e%name% &7arenasının &f%position%. &7pozisyonu &f%location% &7olarak ayarlandı.'
    toggle: '{PREFIX} &7Arena &e%name% &7şimdi &r%state%&7.'
    teleport: '{PREFIX} &e%name% &7arenasının &f%position%. &7noktasına ışınlandınız.'
    save-kit: '{PREFIX} &3%name% &7kiti başarıyla kaydedildi.'
    delete-kit: '{PREFIX} &3%name% &7kiti başarıyla silindi.'
    load-kit: '{PREFIX} &3%name% &7kiti envanterinize yüklendi.'
    set-item: '{PREFIX} &3%name% &7kitinin menü simgesi elinizdeki eşya olarak güncellendi.'
    create-queue: '{PREFIX} &3%kit% &7kiti ve &6$%bet_amount% &7bahsiyle yeni sıra oluşturuldu.'
    delete-queue: '{PREFIX} &3%kit% &7kiti ve &6$%bet_amount% &7bahisli sıra silindi.'
    add-sign: '{PREFIX} &f%location% &7konumundaki tabela &3%kit% &7kiti ve &6$%bet_amount% &7bahsi için ayarlandı.'
    del-sign: '{PREFIX} &f%location% &7konumundaki sıra tabelası silindi.'
    set-lobby: '{PREFIX} &7Düello lobisi mevcut konumunuza ayarlandı.'
    lobby: '{PREFIX} &7Düello lobisine ışınlandınız!'
    edit: '{PREFIX} &f%name% &7adlı oyuncu için işlem tamamlandı: &f%action% %amount% %type%'
    set-rating: '{PREFIX} &f%name% &7adlı oyuncunun &3%kit% &7kiti puanı &a%rating% &7olarak ayarlandı.'
    reset-rating: '{PREFIX} &f%name% &7adlı oyuncunun &3%kit% &7kiti puanı sıfırlandı.'
    reset: '{PREFIX} &f%name% &7adlı oyuncunun istatistikleri sıfırlandı.'
    info:
    - '{HALF_LINE} &7Arena &e%name% {HALF_LINE}'
    - '&7Kullanımda: &r%in_use%'
    - '&7Devre Dışı: &r%disabled%'
    - '&7Bağlı Kitler: &3%kits%'
    - '&7Pozisyonlar: &f%positions%'
    - '&7Oyuncular: &f%players%'
    - '{HALF_LINE} &7Arena &e%name% {HALF_LINE}'
    list:
    - '{LINE}'
    - '&4KOYU KIRMIZI&7: Devre Dışı Arena'
    - '&9MAVİ&7: Doğma Noktaları Eksik Arena'
    - '&aYEŞİL&7: Uygun Arena'
    - '&cKIRMIZI&7: Kullanımda / Maç Oynanan Arena'
    - '&7Arenalar: &r%arenas%'
    - '&7Kitler: &f%kits%'
    - '&7Sıralar: &b%queues%'
    - '&7Sıra Tabelaları: &f%queue_signs%'
    - '&7Düello lobisi konumu: &f%lobby%&7.'
    - '{LINE}'

  spectate:
    usage:
    - '{LINE}'
    - '&f/spectate [oyuncu] &e- &7Düellodaki bir oyuncuyu izler.'
    - '{LINE}'
    start-spectate: '{PREFIX} &e%arena% &7arenasında &f%name% &7vs &f%opponent% &7maçı izleniyor. Çıkmak için: &f/spectate'
    stop-spectate: '{PREFIX} &f%name% &7maçını izlemeyi bıraktınız.'

  sub-command-usage: '{PREFIX} &f/%command% %usage% &e- &7%description%'


